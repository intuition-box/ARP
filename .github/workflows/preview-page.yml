# Publishes apps/preview/ (the preview sign-up page) to GitHub Pages. Static, no build.
name: preview-page

on:
  push:
    branches: [main]
    paths: ['apps/preview/**', '.github/workflows/preview-page.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/preview
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
