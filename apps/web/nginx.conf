# The public site (task 74): static files, and index.html for any address that is not a file, so
# a reload on /agents or /atom/0x… lands on the app, which answers an unknown one with its own 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed by Vite: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The search reads skills.sh's index (task 82), which sends no CORS header, so the browser asks
    # this origin and nginx asks skills.sh. Only the search, with the browser's cookies left behind.
    location = /skills-index/api/search {
        proxy_pass https://skills.sh/api/search;
        proxy_set_header Host skills.sh;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        add_header Cache-Control "public, max-age=300";
    }

    # Dated snapshots for readers outside ARP, such as x402 Doctor (task 89): readable from any origin,
    # and a missing file is a 404, never the app's index.html.
    location /feeds/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri /index.html;
    }
}
