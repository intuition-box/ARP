# The public site (task 74): static files, and index.html for any address that is not a file, so
# a reload on /agents or /atom/0x… lands on the app, which answers an unknown one with its own 404.
# Behind Coolify's proxy every request arrives from a private address: the visitor is the one it
# forwarded. Only a private network may say so, so a visitor cannot pick their own address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=skills_index_visitor:10m rate=20r/m;
limit_req_zone $server_name zone=skills_index_site:1m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed by Vite: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The search reads skills.sh's index (task 82), which sends no CORS header, so the browser asks
    # this origin and nginx asks skills.sh. Only the search, with the browser's cookies left behind.
    location = /skills-index/api/search {
        proxy_pass https://skills.sh/api/search;
        proxy_set_header Host skills.sh;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        # Every visitor's search leaves from this one address, so one visitor must not spend skills.sh's
        # patience for all of them: a few searches a minute each, and a ceiling for the whole site. No
        # cache: its key would be the words searched, kept on the server (ADR 0195).
        limit_req zone=skills_index_visitor burst=10 nodelay;
        limit_req zone=skills_index_site burst=40 nodelay;
        limit_req_status 429;
        # The address carries the words searched, and nginx would log it with every request and with
        # every refusal or upstream error. Nothing here is logged below critical.
        access_log off;
        error_log /dev/stderr crit;
        # The visitor's own browser may keep the answer to their words; no cache in between may.
        # skills.sh sends its own `public` header, which would be read together with this one.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=300";
    }

    # Dated snapshots for readers outside ARP, such as x402 Doctor (task 89): readable from any origin,
    # and a missing file is a 404, never the app's index.html.
    location /feeds/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri /index.html;
    }
}
