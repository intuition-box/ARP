[test]
coverage = true
coverageThreshold = { lines = 0.9, functions = 0.9 }
coveragePathIgnorePatterns = [
  # Other workspaces' sources, loaded through @arp-protocol/core: gated in their own workspace.
  "../../packages/**",
  "test/**",
  # Entrypoint: binds a port and starts the schedule at import; `src/server.ts` is what it runs, tested.
  "src/main.ts",
]
